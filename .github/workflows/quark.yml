name: QuarkCheckIn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python checkIn_Quark.py
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
